[package]
name = "tiktok-obs-connector"
version = "0.1.0-beta.1"
description = "Obtén el servidor y la clave de TikTok LIVE para OBS iniciando sesión mediante Streamlabs"
authors = ["TikTok OBS Connector"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tiktok_obs_connector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
keyring = "4"
open = "5"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
